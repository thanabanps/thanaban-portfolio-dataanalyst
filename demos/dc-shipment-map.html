<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สินค้าถูกส่งไป DC ไหน · Bill 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaeef4;--panel:#fff;--panel2:#f6f8fb;--line:#e1e7f0;--line2:#eef2f7;
  --ink:#16222f;--muted:#5b6b7e;--faint:#93a0b1;--base:#e6ebf3;
  --accent:#e07a12;--accent-soft:#fdf0e0;--accent-line:#f3c896;
  --dc:#123b63;--br:#2f6fe0;--ok:#13a06a;
  --r-central:#0fa3b4;--r-north:#7b54d6;--r-isan:#e8820c;--r-east:#13a06a;--r-west:#d63f86;--r-south:#2f6fe0;--r-none:#9aa6b6;
  --shadow:0 1px 2px rgba(20,40,80,.05),0 10px 26px rgba(20,40,80,.06);
  --fd:'Space Grotesk','Noto Sans Thai',sans-serif;--fb:'Noto Sans Thai','Inter',Tahoma,sans-serif;--fm:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);-webkit-font-smoothing:antialiased;line-height:1.4;overflow:hidden}
.app{height:100vh;max-width:1600px;margin:0 auto;padding:13px 18px;display:flex;flex-direction:column;gap:11px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-family:var(--fm);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--fd);font-weight:600;font-size:clamp(19px,2.2vw,26px);letter-spacing:-.01em;line-height:1.05}
.kpis{display:flex;gap:9px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 13px;box-shadow:var(--shadow);text-align:right;min-width:66px}
.kpi b{display:block;font-family:var(--fd);font-weight:600;font-size:19px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-family:var(--fm);margin-top:4px;display:block}

.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;box-shadow:var(--shadow)}
.seg button{font-family:var(--fb);font-size:13.5px;color:var(--muted);background:transparent;border:none;cursor:pointer;padding:7px 15px;border-radius:7px;transition:.15s;white-space:nowrap}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
select,input[type=search]{background:var(--panel);border:1px solid var(--line);color:var(--ink);font-family:var(--fb);font-size:14px;padding:8px 12px;border-radius:9px;outline:none;box-shadow:var(--shadow)}
select{min-width:130px;max-width:200px}input[type=search]{min-width:220px;flex:1 1 240px;max-width:360px}
select:focus,input:focus{border-color:var(--accent)}
.lab{font-family:var(--fm);font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.crumb{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-family:var(--fm);font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--panel);display:inline-flex;gap:7px;align-items:center}
.tag b{color:var(--ink);font-weight:600}
.reset{cursor:pointer;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent);font-family:var(--fm);font-size:12px;padding:6px 12px;border-radius:999px}

.main{flex:1;min-height:0;display:flex;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2);flex:none;gap:10px}
.card-h h2{font-family:var(--fd);font-weight:500;font-size:14.5px}
.card-h .hint{font-family:var(--fm);font-size:10px;color:var(--faint)}

.col-map{width:452px;flex:none;height:100%}
.mapwrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:6px}
#map{width:100%;height:100%;display:block}
.prov{stroke:#fff;stroke-width:.5;cursor:pointer;transition:opacity .25s}
.prov.dim{opacity:.4}.prov.sel{stroke:var(--accent);stroke-width:1.4}
#labels text{font-family:var(--fb);fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:.6px;stroke-linejoin:round;pointer-events:none;text-anchor:middle}
#labels .z0{fill:#9aa6b6}
.pin{stroke:#fff;cursor:pointer}.pin:hover{stroke:var(--ink)}.pin.sel{stroke:var(--ink);stroke-width:1.3px}
.map-back{position:absolute;top:10px;right:10px;z-index:5;display:none;align-items:center;gap:6px;cursor:pointer;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:9px;padding:7px 11px;font-family:var(--fb);font-size:12.5px;color:var(--ink)}
.map-back.show{display:inline-flex}
.mapfoot{flex:none;border-top:1px solid var(--line2);padding:8px 12px;display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--muted)}
.mapfoot b{color:var(--ink)}
.matchpill{display:inline-flex;align-items:center;gap:6px;font-family:var(--fm);font-size:11px;background:#e7f6ee;border:1px solid #b7e2ca;color:#127a4d;padding:3px 10px;border-radius:999px}

.col-data{flex:1;min-width:0;height:100%}
.data-h{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line2);flex:none;gap:10px}
.data-h .n{font-family:var(--fm);font-size:13.5px;color:var(--accent)}
.body{flex:1;min-height:0;overflow:auto}
.body::-webkit-scrollbar{width:9px;height:9px}.body::-webkit-scrollbar-thumb{background:#cdd7e4;border-radius:5px}

/* grouped */
.dcrow{border-bottom:1px solid var(--line2)}
.dc-head{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:11px;align-items:center;padding:11px 14px;cursor:pointer}
.dc-head:hover{background:var(--panel2)}
.dcrow.open .dc-head{background:#fbfcfe}
.chip{font-family:var(--fm);font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap;border:1px solid}
.tsym{font-size:13px;width:16px;text-align:center}
.tsym.DC{color:var(--dc)}.tsym.สาขา{color:var(--br)}
.dc-mid{min-width:0}
.dc-name{font-size:15.5px;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc-sub{font-family:var(--fm);font-size:12px;color:var(--faint);margin-top:1px}
.dc-cnt{font-family:var(--fm);font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.dc-val{text-align:right;font-family:var(--fm);white-space:nowrap}
.dc-val b{font-size:16.5px;color:var(--accent);font-weight:600}
.dc-val small{display:block;font-size:11.5px;color:var(--faint);margin-top:1px}
.dc-detail{display:none;padding:2px 14px 12px 40px;background:var(--panel2)}
.dcrow.open .dc-detail{display:block}
.po{border-top:1px solid var(--line2);padding:8px 0 6px}
.po:first-child{border-top:none}
.po-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px}
.po-n{font-family:var(--fm);font-size:14px;color:var(--ink);font-weight:600}
.po-n small{color:var(--faint);font-weight:400;margin-left:7px}
.po-v{font-family:var(--fm);font-size:12.5px;color:var(--muted);white-space:nowrap}
.itm{display:grid;grid-template-columns:1fr auto auto;gap:12px;font-size:13.5px;padding:3.5px 0;color:var(--muted)}
.itm .id{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itm .ib,.itm .iv{font-family:var(--fm);text-align:right;white-space:nowrap;color:var(--ink)}
.itm .ib{color:var(--muted)}

/* table */
table.flat{width:100%;border-collapse:collapse;font-size:14px}
table.flat thead th{position:sticky;top:0;background:#fff;z-index:2;font-family:var(--fm);font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--faint);text-align:left;padding:9px 12px;border-bottom:1.5px solid var(--line);cursor:pointer;white-space:nowrap}
table.flat thead th.num{text-align:right}
table.flat thead th:hover{color:var(--accent)}
table.flat thead th .ar{color:var(--accent)}
table.flat td{padding:10px 13px;border-bottom:1px solid var(--line2);vertical-align:top}
table.flat tr:hover td{background:var(--panel2);cursor:pointer}
table.flat .c-dc{white-space:nowrap}
table.flat .c-dc .cd{font-family:var(--fm);font-size:12.5px;color:var(--ink);font-weight:600}
table.flat .c-dc .cn{font-size:12px;color:var(--faint)}
table.flat .c-po{font-family:var(--fm);font-size:13px;color:var(--muted);white-space:nowrap}
table.flat .c-it{color:var(--ink)}
table.flat .c-it small{display:block;color:var(--faint);font-size:11.5px}
table.flat td.num{font-family:var(--fm);text-align:right;white-space:nowrap}
table.flat td.val{color:var(--accent);font-weight:600}
.empty-state{padding:26px;text-align:center;color:var(--faint);font-size:13px}

#tip{position:fixed;pointer-events:none;z-index:60;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;min-width:190px;box-shadow:0 14px 40px rgba(20,40,80,.18);opacity:0;transform:translateY(4px);transition:opacity .12s;font-size:12.5px}
#tip.on{opacity:1;transform:none}
#tip .tp{font-family:var(--fd);font-weight:600;font-size:13.5px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
#tip .tp .bd{font-family:var(--fm);font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;color:#fff}
#tip .nm{font-size:12px;color:var(--muted);margin:3px 0}
#tip .kv{display:flex;justify-content:space-between;gap:14px;font-size:11.5px;padding:1px 0}
#tip .kv span:first-child{color:var(--faint)}#tip .kv span:last-child{font-family:var(--fm);color:var(--ink)}

@media(max-width:1080px),(max-height:560px){
  body{overflow:auto}.app{height:auto;min-height:100vh}
  .main{flex-direction:column}.col-map{width:100%;height:auto}#map{height:auto;max-height:62vh}.mapwrap{height:auto}
  .body{max-height:70vh}
}
</style>
</head>

      </div>
      <div class="body" id="body"></div>
    </div>
  </div>
</div>

function buildPins(vb){
  pinLayer.innerHTML='';const r=vb[2]/78;
  const ds=mapDCs().slice().sort((a,b)=>(a.type==='DC')-(b.type==='DC'));
  ds.forEach(d=>{
    const col=chainColor[d.chain]||'#888',sel=state.dc===d.code;let node;
    if(d.type==='DC'){const rr=r*1.15;node=document.createElementNS('http://www.w3.org/2000/svg','path');
      node.setAttribute('d',`M${d.px},${(d.py-rr).toFixed(1)} L${(d.px+rr).toFixed(1)},${d.py} L${d.px},${(d.py+rr).toFixed(1)} L${(d.px-rr).toFixed(1)},${d.py} Z`);
    }else{node=document.createElementNS('http://www.w3.org/2000/svg','circle');node.setAttribute('cx',d.px);node.setAttribute('cy',d.py);node.setAttribute('r',(r*0.85).toFixed(2));}
    node.setAttribute('fill',col);node.setAttribute('stroke-width',(r*0.3).toFixed(2));node.setAttribute('class','pin'+(sel?' sel':''));
    node.addEventListener('mousemove',e=>showPinTip(e,d));node.addEventListener('mouseleave',()=>tip.classList.remove('on'));
    node.addEventListener('click',e=>{e.stopPropagation();state.dc=state.dc===d.code?'':d.code;state.openDC=d.code;render();
      if(state.dc&&state.view==='grouped'){const el=document.querySelector('.dcrow[data-code="'+d.code+'"]');if(el)el.scrollIntoView({block:'center',behavior:'smooth'});}});
    pinLayer.appendChild(node);
  });
}
const tip=$('#tip');
function showPinTip(e,d){
  tip.innerHTML=`<div class="tp"><span>${d.name}</span><span class="bd" style="background:${d.type==='DC'?'var(--dc)':'var(--br)'}">${d.type}</span></div>
    <div class="nm" style="color:${chainColor[d.chain]}">${d.chain} · ${d.code}</div>
    <div class="kv"><span>จังหวัด</span><span>${d.province}</span></div>
    <div class="kv"><span>ยอด</span><span>${full(d.val)} ฿</span></div>
    <div class="kv"><span>กล่อง</span><span>${full(d.box)}</span></div>
    <div class="kv"><span>PO / รายการ</span><span>${d.nPO} / ${d.nItems}</span></div>`;
  tip.classList.add('on');const w=tip.offsetWidth,h=tip.offsetHeight,pad=14;let x=e.clientX+pad,y=e.clientY+pad;
  if(x+w>innerWidth)x=e.clientX-w-pad;if(y+h>innerHeight)y=e.clientY-h-pad;tip.style.left=x+'px';tip.style.top=y+'px';
}
function paintMap(){
  APP.provinces.forEach(p=>{const el=pathEls[p.th];
    let dim=state.region&&p.region!==state.region;el.classList.toggle('dim',!!dim);el.classList.toggle('sel',false);});
}

// ---------- data views ----------
function buildData(){
  const ds=activeDCs();
  const body=$('#body');
  if(state.view==='grouped'){
    $('#dataCount').textContent=ds.length+' DC';
    $('#dataHint').textContent='คลิก DC เพื่อกาง PO / สินค้า';
    if(!ds.length){body.innerHTML='<div class="empty-state">ไม่พบข้อมูลตามเงื่อนไข</div>';return;}
    body.innerHTML=ds.map(d=>{
      const col=chainColor[d.chain]||'#888',open=state.openDC===d.code;
      return `<div class="dcrow${open?' open':''}" data-code="${d.code}">
        <div class="dc-head">
          <span class="chip" style="color:${col};border-color:${col}66;background:${col}14">${d.chain}</span>
          <span class="tsym ${d.type}">${d.type==='DC'?'◆':'●'}</span>
          <div class="dc-mid"><div class="dc-name">${d.name}</div><div class="dc-sub">${d.code} · ${d.province} · ภาค${d.region}</div></div>
          <div class="dc-cnt">${d.nPO} PO<br>${d.nItems} รายการ</div>
          <div class="dc-val"><b>${fmt(d.val)}</b><small>${full(d.box)} กล่อง</small></div>
        </div>
        <div class="dc-detail">${open?poHTML(d):''}</div></div>`;
    }).join('');
    body.querySelectorAll('.dc-head').forEach(h=>h.onclick=()=>{const c=h.parentElement.dataset.code;state.openDC=state.openDC===c?null:c;buildData();});
  } else {
    // flat table
    const rows=[];const q=state.q.toLowerCase();
    ds.forEach(d=>d.pos.forEach(p=>p.items.forEach(i=>{
      if(state.q&&!((d.code+' '+d.name+' '+d.chain+' '+p.po+' '+i.desc+' '+(i.brand||'')).toLowerCase().includes(q)))return;
      rows.push({code:d.code,name:d.name,chain:d.chain,type:d.type,region:d.region,po:p.po,desc:i.desc,brand:i.brand,box:i.box,val:i.val});
    })));
    const sk=state.sortKey,dir=state.sortDir;
    rows.sort((a,b)=>{let x=a[sk],y=b[sk];if(typeof x==='string')return dir*x.localeCompare(y,'th');return dir*(x-y);});
    $('#dataCount').textContent=rows.length+' รายการ';
    $('#dataHint').textContent='คลิกหัวคอลัมน์เพื่อเรียง · คลิกแถว=ไฮไลต์บนแผนที่';
    if(!rows.length){body.innerHTML='<div class="empty-state">ไม่พบข้อมูลตามเงื่อนไข</div>';return;}
    const ar=k=>state.sortKey===k?`<span class="ar">${state.sortDir<0?'▼':'▲'}</span>`:'';
    body.innerHTML=`<table class="flat"><thead><tr>
      <th data-k="code">DC ${ar('code')}</th><th data-k="po">PO ${ar('po')}</th><th data-k="desc">สินค้า ${ar('desc')}</th>
      <th class="num" data-k="box">กล่อง ${ar('box')}</th><th class="num" data-k="val">ยอด ฿ ${ar('val')}</th></tr></thead><tbody>
      ${rows.map(r=>{const col=chainColor[r.chain]||'#888';return `<tr data-code="${r.code}">
        <td class="c-dc"><span class="cd">${r.type==='DC'?'◆':'●'} ${r.code}</span><div class="cn" style="color:${col}">${r.name}</div></td>
        <td class="c-po">${r.po}</td>
        <td class="c-it">${r.desc}${r.brand?`<small>${r.brand}</small>`:''}</td>
        <td class="num">${full(r.box)}</td><td class="num val">${full(r.val)}</td></tr>`;}).join('')}
      </tbody></table>`;
    body.querySelectorAll('thead th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(state.sortKey===k)state.sortDir*=-1;else{state.sortKey=k;state.sortDir=(k==='val'||k==='box')?-1:1;}buildData();});
    body.querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>{const c=tr.dataset.code;state.dc=state.dc===c?'':c;render();});
  }
}
function poHTML(d){
  return d.pos.map(p=>`<div class="po"><div class="po-h"><span class="po-n">${p.po}<small>${p.items.length} รายการ</small></span>
    <span class="po-v">${full(p.box)} กล่อง · ${full(p.val)} ฿</span></div>
    ${p.items.map(i=>`<div class="itm"><span class="id">${i.desc}${i.brand?' · <span style="color:var(--faint)">'+i.brand+'</span>':''}</span><span class="ib">${full(i.box)} กล่อง</span><span class="iv">${full(i.val)} ฿</span></div>`).join('')}
  </div>`).join('');
}

function buildCrumb(){
  const c=$('#crumb');c.innerHTML='';const parts=[];
  if(state.chain)parts.push(['ห้าง',state.chain]);
  if(state.region)parts.push(['ภาค',state.region]);
  if(state.dc){const d=APP.dcs.find(x=>x.code===state.dc);parts.push(['DC',d?d.name:state.dc]);}
  parts.forEach(([k,v])=>{const t=document.createElement('span');t.className='tag';t.innerHTML=`${k} <b>${v}</b>`;c.appendChild(t);});
  if(parts.length){const b=document.createElement('button');b.className='reset';b.textContent='ล้าง ✕';
    b.onclick=()=>{state.chain='';state.region='';state.dc='';state.q='';$('#chainSel').value='';$('#search').value='';render();};c.appendChild(b);}
}
function render(){paintMap();updateView();buildData();buildCrumb();}

(function init(){
  $('#k-val').textContent=fmt(APP.totals.val);$('#k-box').textContent=full(APP.totals.box);
  $('#k-dc').textContent=APP.totals.dc;$('#k-po').textContent=APP.totals.po;$('#k-item').textContent=APP.totals.items;
  $('#period').textContent=APP.period;
  const m=APP.match;$('#matchPill').textContent=`✓ ship-to ตรง master ${m.matched}/${m.billDC}`;
  if(m.unmatched.length){$('#matchPill').style.cssText='background:#fde7e0;border-color:#f3c4a8;color:#b0561e';$('#matchPill').textContent=`⚠ ไม่ตรง ${m.unmatched.length}`;}
  chains.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=`${c} (${APP.dcs.filter(d=>d.chain===c).length})`;$('#chainSel').appendChild(o);});
  $('#chainSel').onchange=e=>{state.chain=e.target.value;state.dc='';state.openDC=null;render();};
  $('#search').oninput=e=>{state.q=e.target.value.trim();render();};
  $('#viewSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.view=b.dataset.v;$('#viewSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));buildData();});
  $('#mapBack').onclick=()=>{state.region='';state.dc='';render();};
  render();
})();
</script>
</body>
</html>
